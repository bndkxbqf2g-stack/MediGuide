name: Repository guardrails

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required project files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f AGENTS.md
          test -f PROJECT_MASTER_SPEC.md
          test -f MEDICATION_DATA_SCHEMA.md
          test -f MEDICATION_SAFETY_RULES.md
          test -f MODULES.md
          test -f CHANGELOG.md
          test -f IMPORT_HISTORICAL_DATA.md
          test -f tools/import_historical_medications.py
          test -f tools/validate_historical_data.mjs
          test -f data/medications-historical.v0.1.0.json
          test -f app/index.html
          test -f app/app.js
          test -f app/search.js
          test -f app/search.test.mjs
          test -f app/styles.css
          test -f app/manifest.webmanifest
          test -f service-worker.js

      - name: Validate normalized historical dataset
        shell: bash
        run: |
          set -euo pipefail
          node tools/validate_historical_data.mjs data/medications-historical.v0.1.0.json

      - name: Run mobile search tests
        shell: bash
        run: |
          set -euo pipefail
          node --check app/app.js
          node --check app/search.js
          node --check service-worker.js
          node --test app/search.test.mjs

      - name: Reject obvious local-source artifacts
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '*.pdf' -o -name '*.doc' -o -name '*.docx' -o -name '*.xlsx' -o -name '*.zip' \) -not -path './.git/*' | grep -q .; then
            echo "Raw source artifacts must not be committed to the initial repository."
            exit 1
          fi
